name: Browser smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check prayer-data.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - run: node tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimhai-browser-screenshots
          path: test-results
          if-no-files-found: ignore
